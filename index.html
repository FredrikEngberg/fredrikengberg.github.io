<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111318">
  <title>Fredrik Engberg | Connect</title>

  <style>
    :root {
      --bg: #0b0d11;
      --panel: #141821;
      --panel-2: #1a202a;
      --text: #f4f6f8;
      --muted: #9aa4b2;
      --line: #2a3240;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top, #1b2230 0%, transparent 35%),
        linear-gradient(180deg, #0d1015 0%, var(--bg) 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .card {
      width: min(100%, 430px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 34px 26px 28px;
      box-shadow: 0 24px 70px rgba(0,0,0,.35);
    }

    .logo {
      width: 74px;
      height: 74px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border: 1px solid #3a4352;
      border-radius: 22px;
      background: linear-gradient(145deg, #202631, #12161d);
      font-weight: 700;
      font-size: 27px;
      letter-spacing: -2px;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 36px;
      letter-spacing: -1.3px;
    }

    .role {
      margin: 9px 0 28px;
      text-align: center;
      color: var(--muted);
      font-size: 16px;
    }

    .buttons {
      display: grid;
      gap: 12px;
    }

    .button {
      width: 100%;
      min-height: 56px;
      border-radius: 16px;
      border: 1px solid #303948;
      background: var(--panel-2);
      color: var(--text);
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 650;
    }

    .primary {
      background: #eef1f5;
      color: #111318;
      border-color: #eef1f5;
    }

    .disabled {
      opacity: .5;
    }

    .footer {
      margin-top: 24px;
      text-align: center;
      color: #737e8e;
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="logo">FE</div>

    <h1>Fredrik Engberg</h1>
    <p class="role">Embedded Systems & IoT</p>

    <div class="buttons">

      <div class="button primary disabled">
        Spara kontakt
      </div>

      <a class="button"
         href="https://www.linkedin.com/in/fredrik-engberg-5380a014a/"
         target="_blank">
        LinkedIn
      </a>

      <a class="button"
         href="https://github.com/FredrikEngberg"
         target="_blank">
        GitHub
      </a>

      <div class="button disabled">
        E-post
      </div>

    </div>

    <div class="footer">
      Build • Learn • Connect
    </div>

  </main>

</body>
</html>
